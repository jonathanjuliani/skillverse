<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Skillverse</title>
<link rel="stylesheet" href="styles.css">
<!-- The skills: the server answers data.js with window.SKILLVERSE = {...}. -->
<script src="data.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<a class="skip" href="#legend">Skip to agents</a>
<header class="bar">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span class="brand-name">Skillverse</span></div>
  <div class="segmented" role="group" aria-label="View" id="views">
    <button data-view="orbit" aria-pressed="true" title="Every agent in one scene: planets on orbits">Orbit</button>
    <button data-view="3d" aria-pressed="false">3D</button>
    <button data-view="2d" aria-pressed="false">2D</button>
  </div>
  <div class="search" id="search-box">
    <input id="search" type="search" placeholder="Find a skill" autocomplete="off" aria-label="Find a skill">
    <span class="search-count" id="search-count" aria-live="polite"></span>
  </div>
  <button class="icon search-toggle" id="search-toggle" aria-label="Find a skill" aria-expanded="false">⌕</button>
  <span class="stats" id="stats"></span>
</header>

<main id="stage">
  <div class="view" id="view-orbit"></div>
  <div class="view" id="view-3d"></div>
  <div class="view" id="view-2d"></div>
  <div id="loading" role="status">Loading view…</div>
  <nav id="planets" class="planet-nav" aria-label="Go to an agent's planet, or all of them"></nav>
  <div class="canvas-tools">
    <span id="hint"></span>
    <button id="live-follow" class="toggle" aria-pressed="true" title="When skills load, fly the camera to each one. Off: the camera stays where you put it, and the activity still shows">Follow activity</button>
    <button id="fit" title="Frame everything shown (or the selected skill)">Fit</button>
  </div>
</main>

<!-- Wide screens: three floating cards. Phones: one bottom sheet, one card at a time. -->
<div id="sheet" data-tab="live">
  <nav class="sheet-tabs" role="tablist" aria-label="Panels">
    <button role="tab" data-tab="reader" aria-selected="false">Skill</button>
    <button role="tab" data-tab="live" aria-selected="true">Live <span class="live-dot" aria-hidden="true"></span></button>
    <button role="tab" data-tab="agents" aria-selected="false">Agents</button>
    <button class="icon sheet-toggle" id="sheet-toggle" aria-label="Expand" aria-expanded="false">⌃</button>
  </nav>

  <section class="card" id="reader" data-tab="reader" aria-label="Skill">
    <div id="reader-head" class="reader-head"></div>
    <div id="reader-body" class="reader-body"></div>
  </section>

  <section class="card collapsible" id="live" data-tab="live" aria-label="Live activity">
    <button class="card-head" data-collapse="live" aria-expanded="false">
      <span class="live-dot" aria-hidden="true"></span><span class="card-title">Live</span><span class="card-meta" data-live-status>not connected</span>
    </button>
    <div class="card-body">
      <div class="tools">
        <button id="live-demo" title="Play a made-up chain of skills to see the effect">Simulate</button>
        <button id="live-clear" title="Clear the trails and the feed">Clear</button>
        <select id="live-session" title="Whose activity to show" aria-label="Session" hidden></select>
      </div>
      <ol id="feed" class="feed"></ol>
    </div>
  </section>

  <section class="card collapsible" id="agents" data-tab="agents" aria-label="Agents">
    <button class="card-head" data-collapse="agents" aria-expanded="false">
      <span class="card-title">Agents</span><span class="card-meta" id="agents-meta"></span>
    </button>
    <div class="card-body"><div id="legend" tabindex="-1"></div></div>
  </section>
</div>
</body>
</html>

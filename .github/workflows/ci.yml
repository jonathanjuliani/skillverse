name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: One version in package.json, plugin.json and marketplace.json
        run: pnpm run check-version

      - name: Lint and format
        run: pnpm run lint

      - name: Unit tests (pure modules, version script, web view server)
        run: pnpm test

      # The plugin API is early access: validate and test against the current Claude Code.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin
        run: pnpm run validate

      - name: Plugin tests (the pane, against the engine)
        run: pnpm run test:plugin

      # tsconfig.json extends the types Claude Code writes when a session loads the
      # plugin, which CI cannot start (no API key): check the plugin only when they
      # are there, the unit tests always.
      - name: Type check
        run: |
          if [ -d .claude-plugin/types ]; then pnpm run typecheck; else pnpm exec tsc -p tsconfig.test.json; fi

      # A clean runner has no skills anywhere: give the scan one to draw.
      - name: A skill to scan
        run: |
          mkdir -p ~/.claude/skills/demo
          printf -- '---\nname: demo\ndescription: A sample skill for the smoke tests\n---\nSee demo-notes.\n' > ~/.claude/skills/demo/SKILL.md

      - name: Build and run the terminal app
        run: |
          pnpm run build
          node bin/skillverse.mjs --scan --snapshot 100x30 --frames 5 --plain

      - name: The npm package installs and runs
        run: |
          pnpm pack --pack-destination /tmp
          mkdir /tmp/try && cd /tmp/try && npm init -y >/dev/null
          npm install /tmp/jonathanjuliani-skillverse-*.tgz
          ./node_modules/.bin/skillverse --scan --snapshot 80x20 --frames 2 --plain
          ./node_modules/.bin/skillverse run --port 4390
          curl -fsS http://localhost:4390/health
          curl -fsS http://localhost:4390/data.js | head -c 80
          ./node_modules/.bin/skillverse stop
